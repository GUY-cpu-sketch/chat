<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Nuh-Uh Chat — Website Tester</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .tester-page{min-height:100vh;padding:28px 16px 44px;display:grid;place-items:center}
    .tester-wrap{width:min(920px,100%);display:grid;gap:14px}
    .tester-header{text-align:center}.tester-header .brand{justify-content:center;margin-bottom:18px}.tester-header h1{margin:6px 0 8px}
    .tester-subtitle{max-width:650px;margin:0 auto;color:var(--muted);line-height:1.6}
    .tester-card{padding:22px}.target{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:16px;border:1px solid var(--border);border-radius:14px;background:var(--panel-2)}
    .url-input{flex-grow:1;background:transparent;border:0;color:inherit;font-family:monospace;font-size:14px;outline:none;width:100%}
    .actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.tester-note{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
    .result{margin-top:16px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--panel-2)}
    .result-head{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--border)}.result-status{font-size:12px;color:var(--muted)}
    .result-body{padding:26px;text-align:center;color:var(--muted);min-height:170px;display:grid;place-items:center}.result-body p{max-width:560px;margin:0;line-height:1.6}
    @media(max-width:620px){.tester-page{padding:14px 10px 30px}.target{align-items:flex-start;flex-direction:column}.actions{flex-direction:column}.actions .button{width:100%}}
  </style>
</head>
<body class="tester-page">
  <main class="tester-wrap">
    <header class="tester-header">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Nuh-Uh</strong><small>Chat</small></div></div>
      <span class="eyebrow">DEVELOPER TOOL</span>
      <h1>Website tester</h1>
      <p class="tester-subtitle">Preview a public website through the server.</p>
    </header>

    <section class="panel tester-card">
      <span class="eyebrow">TARGET URL</span>
      <div class="target">
        <input type="url" id="targetUrl" class="url-input" value="https://example.com" placeholder="https://example.com" autocomplete="off" spellcheck="false">
        <span class="live-pill" id="status">Ready</span>
      </div>

      <div class="actions">
        <button class="button primary" id="loadBtn" type="button">Load URL</button>
        <a class="button secondary" id="tabBtn" href="#">Open in new tab ↗</a>
        <a class="button ghost" href="/chat.html">← Back to chat</a>
      </div>

      <p class="tester-note">Admin authentication is required to use this developer tool.</p>

      <div class="result" aria-live="polite">
        <div class="result-head"><strong>Preview</strong><span class="result-status" id="resultStatus">Not started</span></div>
        <div class="result-body"><p>Click <strong>Load URL</strong> to open the site. The preview is a normal page.</p></div>
      </div>
    </section>
  </main>

  <script>
    (()=>{const u=document.getElementById('targetUrl'),b=document.getElementById('loadBtn'),t=document.getElementById('tabBtn'),s=document.getElementById('status'),r=document.getElementById('resultStatus');const n=v=>{let x=v.trim();if(x&&!/^https?:\/\//i.test(x))x='https://'+x;return x};const q=(a,c)=>{s.textContent=a;r.textContent=c};const z=async()=>{const target=n(u.value);if(!target){q('Invalid','Enter a valid URL.');return}u.value=target;b.disabled=true;q('Loading…','Creating page…');const token=sessionStorage.getItem('chatToken')||'';if(!token){q('Denied','Admin login is required.');b.disabled=false;return}try{const v=await fetch('/api/proxy/start?url='+encodeURIComponent(target),{headers:{Authorization:'Bearer '+token}});let d={};try{d=await v.json()}catch{}if(!v.ok){q('Error',d.error||('Request failed ('+v.status+')'));b.disabled=false;return}if(!d.url){q('Error','The server did not return a page URL.');b.disabled=false;return}t.href=d.url;t.target='_blank';q('Ready','Opening page…');location.assign(d.url)}catch(e){q('Error',e.message||'Unable to reach the server.');b.disabled=false}};b.addEventListener('click',z);u.addEventListener('keydown',e=>{if(e.key==='Enter')z()});u.addEventListener('input',()=>{t.href='#'})})();
  </script>
</body>
</html>
