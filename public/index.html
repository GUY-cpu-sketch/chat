<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<title>Nuh-Uh Chat — Sign in</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<main class="auth-wrap">
  <section class="panel auth-hero">
    <div>
      <div class="brand"><span class="brand-mark">✦</span><div><strong>Nuh-Uh</strong><small>Chat</small></div></div>
      <h1>Talk. Share. Stay connected.</h1>
      <p>A lightweight real-time chat room with profiles, whispers, moderation, and a cleaner interface.</p>
    </div>
    <ul class="rules">
      <li>No spam or flooding</li>
      <li>Keep avatars appropriate</li>
      <li>Respect everyone in the room</li>
      <li>Follow moderator instructions</li>
    </ul>
  </section>

  <section class="panel auth-card">
    <span class="eyebrow">WELCOME BACK</span>
    <h2>Sign in</h2>
    <input type="text" id="loginUsername" maxlength="24" placeholder="Username" autocomplete="username">
    <input type="password" id="loginPassword" maxlength="128" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="button primary" type="button">Sign in</button>

    <div class="auth-divider"></div>
    <h3>New here?</h3>
    <input type="text" id="registerUsername" maxlength="24" placeholder="Choose a username" autocomplete="username">
    <input type="password" id="registerPassword" maxlength="128" placeholder="Create a password (6+ characters)" autocomplete="new-password">
    <button id="registerBtn" class="button secondary" type="button">Create account</button>
  </section>
</main>
<script src="/socket.io/socket.io.js"></script>
<script src="main.js"></script>
</body>
</html>
